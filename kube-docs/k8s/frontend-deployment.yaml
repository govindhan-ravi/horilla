apiVersion: apps/v1
kind: Deployment
metadata:
  name: horilla-frontend
  namespace: horilla
spec:
  replicas: 2
  selector:
    matchLabels:
      app: horilla-frontend
  template:
    metadata:
      labels:
        app: horilla-frontend
    spec:
      containers:
      - name: nginx
        image: <dockerhub-username>/horilla-frontend:latest # Build and push this to Docker Hub
        ports:
        - containerPort: 80
        volumeMounts:
        - name: media-storage
          mountPath: /usr/share/nginx/html/media
      volumes:
      - name: media-storage
        persistentVolumeClaim:
          claimName: media-pvc
          claimName: media-pvc
