apiVersion: apps/v1
kind: Deployment
metadata:
  name: horilla-backend
  namespace: horilla
spec:
  replicas: 2
  selector:
    matchLabels:
      app: horilla-backend
  template:
    metadata:
      labels:
        app: horilla-backend
    spec:
      containers:
      - name: backend
        image: horilla-backend:latest # Build this using Dockerfile.backend
        envFrom:
        - configMapRef:
            name: horilla-config
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: media-storage
          mountPath: /app/media
      volumes:
      - name: media-storage
        persistentVolumeClaim:
          claimName: media-pvc
          claimName: media-pvc
