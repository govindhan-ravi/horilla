name: Horilla HRMS 🦍 CI/CD Pipeline

on:
  push:
    branches: [ "master", "main", "develop", "1.0" ]
  pull_request:
    branches: [ "master", "main", "develop", "1.0" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality_and_test:
    name: 🛡️ Quality & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: horilla_test
          POSTGRES_USER: horilla
          POSTGRES_PASSWORD: horilla_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # 1. Workflow Trigger (defined above)
    
    # 2. Code Checkout
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Full history for SonarQube

    # 3. Setup Environments
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Set up Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: "18"

    # 4. Caching
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.npm
        key: ${{ runner.os }}-build-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-

    # 5. Frontend Dependency Install
    - name: Install Node dependencies
      if: hashFiles('package.json') != ''
      run: npm install

    # 6. Frontend Compilation (Simulated step if mix exists)
    - name: Compile Frontend Assets
      if: hashFiles('webpack.mix.js') != ''
      run: npm run development

    # 7. SonarQube Scan
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # 8. PostgreSQL Service (defined as service container above)

    # 9. Schema Validation
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Database Migrations
      env:
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: horilla_test
        DB_USER: horilla
        DB_PASSWORD: horilla_password
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: ci-test-key
        DEBUG: True
      run: |
        python manage.py makemigrations
        python manage.py migrate

    # 10. Django Unit Testing
    - name: Run Unit Tests
      env:
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: horilla_test
        DB_USER: horilla
        DB_PASSWORD: horilla_password
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: ci-test-key
        DEBUG: True
      run: python manage.py test

    # 11. Bandit Security Scan
    - name: Bandit Security Scan
      run: |
        pip install bandit
        bandit -r . -x ./tests

  docker_build_and_scan:
    name: 🐳 Docker Build & Security
    needs: quality_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # 12. Docker Build (Backend & Frontend)
    - name: Build Backend Image
      run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }} -f Dockerfile.backend .

    - name: Build Frontend Image
      run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }} -f Dockerfile.frontend .

    # 13. Trivy Vulnerability Scan
    - name: Run Trivy vulnerability scanner (Backend)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}"
        format: "table"
        exit-code: "1"
        ignore-unfixed: true
        vuln-type: "os,library"
        severity: "CRITICAL,HIGH"

    # 14. Image Tagging & Publishing to GHCR
    - name: Log in to the Container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Backend Image
      if: github.event_name != 'pull_request'
      run: |
        docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest

    - name: Push Frontend Image
      if: github.event_name != 'pull_request'
      run: |
        docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest

    # 15. Deployment/Publishing Success (handled above)
